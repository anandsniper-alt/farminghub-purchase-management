function orderActions(o){const edit=canEdit(user,o);let a='';if(edit&&o.status==='DRAFT')a+=button('Edit draft','edit-draft',{id:o.id},'','edit')+button('Submit for approval','submit-po',{id:o.id},'primary','check');else if(canApprove(user)&&o.status==='PENDING_APPROVAL')a+=button('Approve & issue','approve-po',{id:o.id},'primary','check');else if(edit&&!o.pi)a+=button('Record supplier PI','pi',{id:o.id},'primary','plus');else if(edit&&['RECEIVED','REVERIFY'].includes(o.pi?.status))a+=button('Verify PI','verify-pi',{id:o.id},'primary','check');else if(canApprove(user)&&o.pi?.status==='VERIFIED')a+=button('Approve PI','approve-pi',{id:o.id},'primary','check');else if(edit&&o.pi?.status==='APPROVED'&&!o.productionStartedAt)a+=button('Start production','start-production',{id:o.id},'primary','box');else if(edit&&o.productionStartedAt&&!o.productionCompletedAt)a+=button('Complete production','complete-production',{id:o.id},'primary','check');else if(edit&&shipmentTotals(o).allocated<shipmentTotals(o).required&&!o.manualClosed)a+=button('Plan shipment','shipment',{id:o.id},'primary','ship');return a+button('Print PO','print',{id:o.id},'','print');}
function orderView(){const o=getOrder(ui.orderId);if(!o)return empty('Order unavailable','This order is outside your assigned division or no longer exists.','lock');const f=financials(state,o),q=shipmentTotals(o),tabs=[['overview','Overview'],['items','Items & artwork'],['finance','PI & payments'],['shipments','Shipments & QC'],['documents','Documents'],['history','Activity history']];return head('LAE Import / <a href="#/orders">Order pipeline</a>',esc(o.number||'Unnumbered draft')+` <span style="vertical-align:middle;margin-left:8px">${sb(o)}</span>`,`Rev ${o.revision} · ${dt(o.createdAt)} · ${esc(owner(o.buyerId))}`,orderActions(o))+(o.amendment?note(`<div class="flex spread"><span>Amendment pending: ${esc(o.amendment.reason)}</span>${canApprove(user)?button('Approve revision','approve-amendment',{id:o.id},'small primary'):''}</div>`,'warn')+'<div class="gap"></div>':'')+`<div class="detail-summary">${[['Linked VMS vendor',esc(vendor(o)?.name),esc(vendor(o)?.code)],['Purchase order value',formatMoney(orderTotal(o),o.currency),q.required+' units · '+o.lines.length+' brand SKU(s)'],['Required port arrival',dt(o.requestedPortDate),(o.planningTat||'—')+' days · manual planning TAT'],['Financial balance',formatMoney(f.balance,o.currency),f.status+' · original order only']].map(([l,v,s])=>`<div class="summary-cell"><div class="summary-label">${l}</div><div class="summary-value">${v}</div><div class="summary-sub">${s}</div></div>`).join('')}</div><div class="tabs">${tabs.map(([v,l])=>`<button class="tab ${ui.tab===v?'active':''}" data-action="tab" data-value="${v}">${l}</button>`).join('')}</div>${({overview:orderOverview,items:orderItems,finance:orderFinance,shipments:orderShipments,documents:orderDocuments,history:orderHistory}[ui.tab]||orderOverview)(o)}`;}
function orderOverview(o){const q=shipmentTotals(o),edit=canEdit(user,o),done={PO:!!o.revisions.length,PI:o.pi?.status==='APPROVED',CONFIRM:o.confirmation?.revision===o.revision,PRODUCTION:!!o.productionStartedAt,ARTWORK:!!o.artwork.current,READY:!!o.productionCompletedAt,QC:o.shipments.some(s=>s.qc?.result==='PASS'),DEPARTURE:!!q.departed,PORT:q.arrived>=q.required};const first=STAGES.find(([k])=>!done[k])?.[0];return `<div class="progress-track">${STAGES.map(([k,l],i)=>`<div class="step ${done[k]?'done':first===k?'current':''}"><div class="step-mark">${done[k]?icon('check',12):i+1}</div>${l}</div>`).join('')}</div><div class="grid-main"><div><div class="panel">${ph('Planning & supplier commitments','Master standard, baseline and current commitment remain distinct.',edit&&o.productionStartedAt&&!o.productionCompletedAt?button('Update commitment','commitment',{id:o.id},'small','edit'):'')}<div class="panel-body"><div class="kv-grid">${kv('Supplier standard',o.standardProductionDays+' days')}${kv('Agreed production time',o.productionDays+' days '+(o.productionOverrideReason?badge('Override','amber'):''))}${kv('Production started',dt(o.productionStartedAt))}${kv('Current completion commitment',dt(o.productionDue))}${kv('Original completion baseline',dt(o.baselineProductionDue))}${kv('Route',esc(state.routes.find(r=>r.id===o.routeId)?.name||'Not set'))}${kv('Cost center / channel',esc([o.costCenter,o.channel].filter(Boolean).join(' · ')||'Not set'))}${kv('Sales requirement reference',esc(o.demandReference||'Optional — forecasting is deferred'))}</div><div class="gap"></div>${note(esc(o.productionOverrideReason||o.notes||'No additional commercial remarks.'))}</div></div><div class="gap"></div><div class="panel">${ph('Order follow-ups','Outcome, contact and remarks are required.',edit?button('Add task','task',{id:o.id},'small','plus'):'')}${taskTable(o.tasks.filter(t=>!t.completedAt).map(t=>({o,t})))}</div></div><div><div class="panel">${ph('Attention on this order')}${flagList(flagsFor(state,o),5)}</div><div class="gap"></div><div class="panel">${ph('Quick actions','Every transaction update is visible below.')}<div class="panel-body" style="display:flex;flex-direction:column;gap:9px">${edit&&o.revisions.length?button('Supplier PO confirmation','supplier',{id:o.id},'','check'):''}${edit?button('Log interaction / correction','note',{id:o.id},'','history'):''}${edit&&o.revisions.length&&!o.amendment?button('Propose PO revision','amendment',{id:o.id},'','edit'):''}${edit&&o.revisions.length?button('Record / replace PI','pi',{id:o.id},'','file'):''}${edit?button('Add estimated / actual cost','cost',{id:o.id},'','plus'):''}${canApprove(user)&&o.status==='PENDING_APPROVAL'?button('Return to draft','return-po',{id:o.id},'','arrow'):''}${canApprove(user)&&o.revisions.length&&!o.manualClosed?button('Short-close residual quantity','short-close',{id:o.id},'danger','close'):''}</div></div></div></div>`;}
function orderItems(o){const r=o.revisions[ui.revision??o.revisions.length-1],lines=r?.snapshot.lines||o.lines;const ed=canEdit(user,o);return `<div class="panel">${ph('Fixed technical specification package',r?`PO Rev ${r.revision} · ${dt(r.at)} · ${esc(r.actor)}`:'Draft — not yet an issued snapshot',o.revisions.length?`<select id="revision-select" class="select-small">${o.revisions.map((r,i)=>`<option value="${i}" ${(ui.revision??o.revisions.length-1)===i?'selected':''}>PO Rev ${r.revision}</option>`).join('')}</select>`:'')}<div class="table-wrap"><table><thead><tr><th>Brand SKU / item</th><th>Base / brand</th><th>Technical version</th><th class="right">Qty</th><th class="right">Unit price</th><th class="right">Line total</th></tr></thead><tbody>${lines.map(l=>`<tr><td><b class="code-link">${esc(l.code)}</b><div class="sub">${esc(l.name)}</div></td><td>${esc(l.baseCode)}<div class="sub">${esc(l.brand)}</div></td><td>${badge(l.specification?.version||approvedSpec(state,l.baseId,l.specId)?.version||'Unselected','green')}</td><td class="right">${l.quantity}</td><td class="right">${formatMoney(l.unitPriceMinor,o.currency)}</td><td class="right strong">${formatMoney(l.quantity*l.unitPriceMinor,o.currency)}</td></tr>`).join('')}</tbody></table></div><div class="panel-body">${lines.map(l=>`<div class="form-section">${esc(l.code)} · Company requirements</div><pre class="spec-text">${esc(l.specification?.description||approvedSpec(state,l.baseId,l.specId)?.description||'Choose an approved technical version before issue.')}</pre>${note('<b>Brand-specific requirement:</b> '+esc(l.artworkNotes||'Not supplied'))}`).join('')}</div><div class="panel-footer">This is an interim specification package, not full PLM. New master revisions do not rewrite issued orders.</div></div><div class="gap"></div><div class="panel">${ph('Artwork & supplier acceptance','Independent artwork annexures; technical version is unchanged.',ed&&o.revisions.length&&!o.artwork.pending?button('Submit artwork','artwork',{id:o.id},'small primary','upload'):'')}<div class="panel-body">${o.artwork.pending?`${note(`<b>${esc(o.artwork.pending.label)}</b> awaits Product Manager final approval.`,'warn')}<div class="gap"></div>${canProductApprove(user)?button('Approve artwork','approve-artwork',{id:o.id},'primary','check'):''}`:''}${o.artwork.current?`<div class="kv-grid">${kv('Current approved artwork',esc(o.artwork.current.label))}${kv('Approved by / date',esc(o.artwork.current.approvedBy)+' · '+dt(o.artwork.current.approvedAt))}${kv('Supplier confirmation',badge(o.artwork.supplierConfirmed?'Confirmed':'Pending',o.artwork.supplierConfirmed?'green':'amber'))}${kv('Remarks',esc(o.artwork.current.remarks))}</div><div class="gap"></div><div class="flex wrap">${button('Open artwork','file',{file:o.artwork.current.fileId},'small','file')}${ed?button('Supplier artwork confirmation','artwork-confirm',{id:o.id},'small','check'):''}</div>`:o.artwork.pending?'':empty('No approved artwork yet','Purchase submits; Product Manager approves; supplier acceptance is uploaded.','file')}<div class="gap"></div>${note('Pilot policy: artwork is a separately identified annexure. Dispatch is held until current artwork is approved and acknowledged. Review this policy before live rollout.','blue')}</div></div>`;}
function orderFinance(o){const f=financials(state,o),ed=canEdit(user,o),alloc=state.payments.flatMap(p=>p.allocations.filter(a=>a.orderId===o.id).map(a=>({p,a})));return `<div class="grid-two"><div class="panel">${ph('Supplier proforma invoice',esc(o.pi?.number||'Not received'),ed?button(o.pi?'Replace PI':'Upload PI','pi',{id:o.id},'small','upload'):'')}<div class="panel-body">${o.pi?`<div class="kv-grid">${kv('PI amount',formatMoney(o.pi.amountMinor,o.pi.currency))}${kv('Status',badge(o.pi.status,o.pi.status==='APPROVED'?'green':'amber'))}${kv('PI date',dt(o.pi.date))}${kv('Quantity',o.pi.quantity+' units')}</div><div class="gap"></div><div class="flex wrap">${button('Open PI','file',{file:o.pi.fileId},'small','file')}${ed&&['RECEIVED','REVERIFY'].includes(o.pi.status)?button('Verify PI','verify-pi',{id:o.id},'small primary','check'):''}${canApprove(user)&&o.pi.status==='VERIFIED'?button('Approve PI','approve-pi',{id:o.id},'small primary','check'):''}</div>`:empty('PI required before payment','Purchase verification precedes manager approval.','file')}</div></div><div class="panel">${ph('Original-order settlement','Reported payment is not supplier-confirmed realization.')}<div class="panel-body"><div class="kv-grid">${kv('Order obligation',formatMoney(f.total,o.currency))}${kv('Reported equivalent',formatMoney(f.reported,o.currency))}${kv('Actual supplier realization',formatMoney(f.realized,o.currency))}${kv('Original-order balance',formatMoney(f.balance,o.currency))}</div><div class="gap"></div>${note(`${f.pending} allocation(s) awaiting receipt. Differences remain on this order; no automatic cross-order adjustment.`)}</div></div></div><div class="gap"></div><div class="panel">${ph('Terms-driven payment milestones',esc(o.paymentTerms.name),ed?button('Record bank payment','payment',{id:o.id},'small primary','plus'):'')}<div class="table-wrap"><table><thead><tr><th>Milestone</th><th>Shipment / trigger</th><th>Due date</th><th class="right">Obligation</th><th class="right">Reported / realized</th><th>Authorization</th></tr></thead><tbody>${paymentSchedule(state,o).map(m=>`<tr><td class="strong">${esc(m.name)}<div class="sub">${m.percent}%</div></td><td>${esc(m.shipmentLabel||'Order / unallocated')}<div class="sub">${m.trigger}</div></td><td>${m.due?dt(m.due):badge('Awaiting '+m.awaiting,'dark')}</td><td class="right">${formatMoney(m.amount,o.currency)}</td><td class="right">${formatMoney(m.reported,o.currency)}<div class="sub">Realized ${formatMoney(m.paid,o.currency)}</div></td><td>${m.authorized?badge('Authorized','green'):canApprove(user)&&o.pi?.status==='APPROVED'&&(m.trigger==='PI'||m.shipmentId)?button('Authorize','authorize-payment',{id:o.id,term:m.index,shipment:m.shipmentId||''},'small'):badge('Not authorized','amber')}</td></tr>`).join('')}</tbody></table></div></div><div class="gap"></div><div class="panel">${ph('Bank payment allocations','Multiple orders can share one remittance; each amount stays traceable.')}<div class="table-wrap"><table><thead><tr><th>Reference</th><th>Date</th><th>Allocated</th><th>Supplier realization</th><th>State</th><th></th></tr></thead><tbody>${alloc.map(({p,a})=>`<tr><td class="mono">${esc(p.reference)}</td><td>${dt(p.date)}</td><td>${formatMoney(a.remitMinor,p.currency)}</td><td>${a.realizedMinor===null?'Pending':formatMoney(a.realizedMinor,a.invoiceCurrency)}</td><td>${badge(p.status,p.status==='VOID'?'red':a.realizedMinor!==null?'green':'amber')}</td><td>${ed&&p.status!=='VOID'?button(a.realizedMinor===null?'Record receipt':'Correct receipt','receipt',{id:o.id,payment:p.id,allocation:a.id},'small'):''}</td></tr>`).join('')||`<tr><td colspan="6">${empty('No payments reported')}</td></tr>`}</tbody></table></div></div><div class="gap"></div><div class="panel">${ph('Estimated and actual costs','Native-currency costs, not an accounting ledger.',ed?button('Add cost','cost',{id:o.id},'small','plus'):'')}<div class="table-wrap"><table><thead><tr><th>Category</th><th>Kind</th><th>Remarks</th><th class="right">Amount</th></tr></thead><tbody>${state.costs.filter(c=>c.orderId===o.id).map(c=>`<tr><td>${esc(c.category)}</td><td>${badge(c.kind,'dark')}</td><td>${esc(c.remarks)}</td><td class="right">${formatMoney(c.amountMinor,c.currency)}</td></tr>`).join('')||`<tr><td colspan="4">${empty('No additional costs recorded')}</td></tr>`}</tbody></table></div></div>`;}
function shipmentCard(o,s){const ed=canEdit(user,o),open=s.status!=='CANCELLED';return `<div class="panel" style="margin-bottom:18px">${ph(`<span class="code-link">${esc(s.number)}</span> &nbsp; ${badge(s.status,s.actualArrival?'green':s.actualDeparture?'blue':'dark')}`,`${esc(o.number)} · ${esc(s.container||'Container not assigned')} · ${s.lines.reduce((n,l)=>n+l.quantity,0)} units`,button('Order','open-order',{id:o.id},'small ghost','arrow'))}<div class="shipment-facts">${kv('Route',esc(s.origin)+' → '+esc(s.destination))}${kv('Vessel / voyage',esc([s.vessel,s.voyage].filter(Boolean).join(' · ')||'Not supplied'))}${kv('Baseline → current ETA',sd(s.baselineEta)+' → <b>'+sd(s.eta)+'</b>')}${kv('Actual port arrival',dt(s.actualArrival))}${kv('Baseline → current ETD',sd(s.baselineEtd)+' → <b>'+sd(s.etd)+'</b>')}${kv('Actual departure',dt(s.actualDeparture))}${kv('BL number / date',esc(s.blNumber||'Not recorded')+'<br>'+dt(s.blDate))}${kv('Forwarder',esc(state.vendors.find(v=>v.id===s.forwarderId)?.name||'Not assigned'))}</div><div class="qc-band">${badge(s.qc?.result||'QC PENDING',s.qc?.result==='PASS'?'green':s.qc?.result==='ISSUES'?'red':'amber')}<span>${esc(s.qc?.remarks||'Pre-dispatch QC remarks are mandatory.')}</span></div>${s.alterations.length?`<div style="margin:12px 18px">${note(s.alterations.length+' specification/artwork alteration(s) require checks before dispatch; retained for post-receipt feedback.','warn')}</div>`:''}<div class="ship-actions">${ed&&open&&!s.actualArrival?button('Update ETD / ETA','shipment-update',{id:o.id,shipment:s.id},'small','edit'):''}${ed&&open&&!s.actualDeparture?button('Record QC','qc',{id:o.id,shipment:s.id},'small','check'):''}${ed?button('Upload document','document',{id:o.id,shipment:s.id},'small','upload'):''}${ed&&open?button('Final BL','bl',{id:o.id,shipment:s.id},'small','file'):''}${ed&&open&&!s.actualDeparture?button('Confirm dispatch','dispatch',{id:o.id,shipment:s.id},'small primary','ship'):''}${ed&&s.actualDeparture&&!s.actualArrival?button('Confirm port arrival','arrival',{id:o.id,shipment:s.id},'small primary','check'):''}${canApprove(user)&&open&&!s.actualDeparture?button('Cancel allocation','cancel-shipment',{id:o.id,shipment:s.id},'small danger'):''}</div></div>`;}
function orderShipments(o){const q=shipmentTotals(o);return note(`<div class="flex spread wrap"><span>${q.required} ordered · ${q.allocated} allocated · ${q.departed} departed · ${q.arrived} port-arrived.</span>${canEdit(user,o)?button('Plan shipment','shipment',{id:o.id},'small primary','plus'):''}</div>`)+`<div class="gap"></div>${o.shipments.map(s=>shipmentCard(o,s)).join('')||`<div class="panel">${empty('No shipments planned','Container booking can precede production completion.','ship')}</div>`}`;}
function orderDocuments(o){return `<div class="panel">${ph('Order and shipment evidence','Actual selected files with order / shipment / revision references.',canEdit(user,o)?button('Upload document','document',{id:o.id},'small primary','upload'):'')}<div class="document-list">${o.documents.map(d=>`<div class="doc-card"><div class="doc-symbol">${icon('file',18)}</div><div style="min-width:0;flex:1"><h3 title="${esc(d.name)}">${esc(d.name)}</h3><p>${esc(d.type.replaceAll('_',' '))}<br>Rev ${d.revision} · ${sd(d.uploadedAt)}<br>${esc(d.uploadedBy)}</p></div><button class="icon-button" data-action="file" data-file="${d.fileId}" aria-label="Download evidence">${icon('download',13)}</button></div>`).join('')||empty('No files uploaded')}</div><div class="panel-footer">Shipment-specific regulatory requirements must be confirmed before live use; this is not a legal compliance certificate.</div></div>`;}
function orderHistory(o){const events=state.events.filter(e=>e.entityType==='order'&&e.entityId===o.id).slice().reverse();return `<div class="panel">${ph('One continuous order history',`${events.length} entries · earlier records are never silently replaced.`,canEdit(user,o)?button('Log interaction','note',{id:o.id},'small primary','plus'):'')}<div class="timeline">${events.map(e=>`<div class="timeline-event"><div class="timeline-marker">${icon(e.action.includes('PAYMENT')?'money':e.action.includes('APPROV')?'check':'history',12)}</div><div class="timeline-content"><div class="event-top"><span>${esc(e.actorName)} · ${esc(e.source||'User action')}</span><span>${dt(e.at)} · ${e.at.slice(11,16)} UTC</span></div><p><b>${esc(e.action.replaceAll('_',' '))}</b><br>${esc(e.summary)}</p>${e.oldValue||e.newValue?`<details><summary>View previous and new values</summary><pre>${esc(JSON.stringify({previous:e.oldValue,updated:e.newValue},null,2))}</pre></details>`:''}${canEdit(user,o)?button('Add correction note','note',{id:o.id,event:e.id},'small ghost'):''}</div></div>`).join('')}</div></div>`;}
function taskTable(rows){return `<div class="table-wrap"><table><thead><tr><th>Task / order</th><th>Due</th><th>Owner</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(({o,t})=>{const late=!t.completedAt&&t.due<isoDay();return `<tr><td class="strong">${esc(t.title)}<div class="sub"><a href="#/order/${o.id}">${esc(o.number)}</a></div></td><td class="${late?'due-red':''}">${dt(t.due)}</td><td>${esc(owner(t.owner).replace('Demo ',''))}</td><td>${badge(t.completedAt?'Completed':late?'Overdue':t.due===isoDay()?'Today':'Upcoming',t.completedAt?'green':late?'red':'amber')}</td><td>${!t.completedAt&&canEdit(user,o)?button('Record outcome','task-complete',{id:o.id,task:t.id},'small','check'):button('Open','open-order',{id:o.id},'small ghost','arrow')}</td></tr>`;}).join('')||`<tr><td colspan="5">${empty('No follow-ups in this view','Each order has its own task schedule.','clock')}</td></tr>`}</tbody></table></div>`;}
function tasksView(){const rows=visibleOrders().flatMap(o=>o.tasks.map(t=>({o,t}))).filter(({t})=>ui.status==='ALL'||!t.completedAt).sort((a,b)=>a.t.due.localeCompare(b.t.due));const open=rows.filter(({t})=>!t.completedAt),flags=allFlags();return head('LAE Import / Tasks','Tasks & follow-ups','Record supplier outcomes and reasons. A late completion does not erase its delay.')+`<div class="kpi-grid">${kpi('Open tasks',open.length,'Independent per order','clock')}${kpi('Due today',open.filter(({t})=>t.due===isoDay()).length,'Outcome and remarks required','calendar')}${kpi('Overdue tasks',open.filter(({t})=>t.due<isoDay()).length,'Visible until action is recorded','alert',true)}${kpi('Orders with critical flags',new Set(flags.filter(f=>f.level==='critical').map(f=>f.orderId)).size,'Planning, payment and execution','orders')}</div><div class="grid-main"><div class="panel">${ph('Purchase-team worklist','Weekly recurring follow-ups plus manually added work.',`<select id="task-status" class="select-small"><option value="OPEN" ${ui.status!=='ALL'?'selected':''}>Open tasks</option><option value="ALL" ${ui.status==='ALL'?'selected':''}>All tasks & outcomes</option></select>`)}${taskTable(rows)}</div><div class="panel">${ph('Red flags & advance warnings','Causes remain attributable to the responsible party.')}<div style="max-height:700px;overflow:auto">${flagList(flags,200)}</div></div></div>`;}

d></tr>`).join('')||`<tr><td colspan="7">${empty('No remittances recorded')}</td></tr>`}</tbody></table></div></div><div class="gap"></div><div class="panel">${ph('Order-by-order settlement','A consolidated supplier view does not transfer credits between orders.')}<div class="table-wrap"><table><thead><tr><th>Order</th><th>Operational stage</th><th class="right">Obligation</th><th class="right">Realized</th><th class="right">Balance</th><th>Financial status</th></tr></thead><tbody>${os.map(o=>{const f=financials(state,o);return `<tr class="row-click" data-action="open-order" data-id="${o.id}"><td class="code-link">${esc(o.number)}</td><td>${sb(o)}</td><td class="right">${formatMoney(f.total,o.currency)}</td><td class="right">${formatMoney(f.realized,o.currency)}</td><td class="right strong">${formatMoney(f.balance,o.currency)}</td><td>${badge(f.status,f.status==='SETTLED'?'green':'amber')}</td></tr>`;}).join('')}</tbody></table></div></div>`;}

function vendorsView(){const vs=state.vendors.filter(v=>v.scopes.some(s=>scopeAllowed(user,s))).filter(v=>!ui.search||[v.name,v.code,v.contact].join(' ').toLowerCase().includes(ui.search.toLowerCase()));return head('Shared master / Vendor Management','Vendor directory','ACTIVE suppliers and logistics parties use one permanent vendor reference.',canApprove(user)?button('Add vendor','vendor-edit',{},'primary','plus'):'')+note('Local review directory only. Your existing VMS is not synchronized or replaced. Demo supplier names are placeholders around the codes in your item file; they are not verified company identities.','blue')+`<div class="gap"></div><div class="panel"><div class="toolbar"><div class="filters"><input id="view-search" value="${esc(ui.search)}" placeholder="Search vendor name or code" aria-label="Search vendor">${badge(vs.length+' records','dark')}</div></div><div class="table-wrap"><table><thead><tr><th>Vendor / code</th><th>Party type</th><th>Status</th><th>Production default</th><th>Open orders</th><th></th></tr></thead><tbody>${vs.map(v=>`<tr><td class="strong">${esc(v.name)}<div class="sub mono">${esc(v.code)}</div></td><td>${badge(v.kind==='LOGISTICS'?'Logistics':'Product supplier',v.kind==='LOGISTICS'?'blue':'dark')}</td><td>${badge(v.status,v.status==='ACTIVE'?'green':'red')}</td><td>${v.kind==='LOGISTICS'?'—':v.productionDays+' days'}</td><td>${visibleOrders().filter(o=>o.vendorId===v.id&&!['PORT_ARRIVED','SHORT_CLOSED'].includes(orderStatus(o))).length}</td><td>${button('View','vendor-view',{vendor:v.id},'small')}${canApprove(user)?button('Edit','vendor-edit',{vendor:v.id},'small ghost','edit'):canCreate(user)?button('Request update','vendor-request',{vendor:v.id},'small ghost'):''}</td></tr>`).join('')}</tbody></table></div></div>`;}

 if(ui.masterTab==='categories')body=`<div class="panel">${ph('LAE category master',`${state.categories.length} configurable categories; no hardcoded product limit.`,canApprove(user)?button('Add category','category',{},'small','plus'):'')}<div class="table-wrap"><table><thead><tr><th>Category</th><th>Item rows</th><th>State</th></tr></thead><tbody>${state.categories.map(c=>`<tr><td class="strong">${esc(c.name)}</td><td>${state.items.filter(i=>i.category===c.name).length}</td><td>${badge(c.active?'Active':'Inactive',c.active?'green':'dark')}</td></tr>`).join('')}</tbody></table></div></div>`;
 if(ui.masterTab==='imports')body=`<div class="panel">${ph('Retained import batches','Original file, uploader, mapping version and row results are preserved.')}<div class="table-wrap"><table><thead><tr><th>Filename / batch</th><th>Uploader</th><th>Date</th><th>Rows</th><th>Mapping</th><th></th></tr></thead><tbody>${state.imports.map(b=>`<tr><td class="strong">${esc(b.filename)}<div class="sub mono">${b.id}</div></td><td>${esc(b.by)}</td><td>${dt(b.at)}</td><td>${b.count}</td><td>${b.mappingVersion}</td><td>${button('Source','file',{file:b.sourceFileId},'small','download')}</td></tr>`).join('')||`<tr><td colspan="6">${empty('No committed upload batches','Reading the demo source is not a live import.','upload')}</td></tr>`}</tbody></table></div></div>`;

 else if(t==='qc'){type='RECORD_QC';payload={...payload,result:f.result,remarks:f.remarks,shipmentId:d.shipment,checkedAlterations:all.getAll('checkedAlterations'),fileId:file?.size?await upload(file,[d.id]):null};}
 else if(t==='shipment-update'){type='UPDATE_SHIPMENT';payload={...payload,...f,shipmentId:d.shipment};}
 else if(t==='dispatch'||t==='arrival'){type=t==='dispatch'?'DISPATCH_SHIPMENT':'ARRIVE_SHIPMENT';payload={...payload,...f,shipmentId:d.shipment};}
 else if(t==='bl'){type='RECORD_BL';payload={...payload,...f,shipmentId:d.shipment,fileId:await upload(file,[d.id])};delete payload.file;}
 else if(t==='document'){type='ATTACH_DOCUMENT';payload={...payload,type:f.type,shipmentId:f.shipmentId||null,fileId:await upload(file,[d.id])};}
 else if(t==='short-close'){type='SHORT_CLOSE_ORDER';payload={...payload,...f};}
 else if(t==='cancel-shipment'){type='CANCEL_SHIPMENT';payload={...payload,...f,shipmentId:d.shipment};}
 else if(t==='return-po'){type='RETURN_ORDER';payload={...payload,...f};}
 else if(t==='void-payment'){type='VOID_PAYMENT';payload={paymentId:d.payment,remarks:f.remarks};}
 else if(t==='cost'){type='ADD_COST';payload={...payload,...f};}
 else if(t==='payment'){type='RECORD_PAYMENT';const p=structuredClone(ui.payment);const allocations=p.allocations.map(a=>{const o=getOrder(a.orderId),m=o&&paymentSchedule(state,o).find(m=>m.key===a.termKey);if(!m)throw new Error('Select an authorized order / shipment payment milestone.');return {orderId:a.orderId,termIndex:m.index,shipmentId:m.shipmentId,amount:a.amount,invoiceRate:a.invoiceRate};});payload={...p,allocations,fileId:await upload(file,allocations.map(a=>a.orderId))};}
 else if(t==='receipt'){type='ACKNOWLEDGE_PAYMENT';payload={paymentId:d.payment,allocationId:d.allocation,realizedAmount:f.realizedAmount,supplierRate:f.supplierRate,remarks:f.remarks,fileId:await upload(file,[d.id])};}
 else if(t==='base'||t==='plm-base'){type='CREATE_BASE';payload=f;}
 else if(t==='spec'||t==='plm-revision'){type='SAVE_SPEC';const b=getBase(d.base),tpl=state.plmTemplates?.find(x=>x.id===b?.templateId)||templateForCategory(state,b?.category),fieldValues={};if(tpl)for(const fld of tpl.fields.filter(x=>x.active!==false))fieldValues[fld.key]=f['plmfield-'+fld.key]||'';const fileIds=[];for(const pf of all.getAll('files'))if(pf?.size)fileIds.push(await upload(pf,[]));payload={baseId:d.base,version:f.version,changeSummary:f.changeSummary,reason:f.reason,description:f.description||'',fieldValues,fileIds};}
 else if(t==='plm-successor'){type='CREATE_SUCCESSOR';payload={...f,previousBaseId:d.base};}
 else if(t==='reject-spec'){type='REJECT_SPEC';payload={baseId:d.base,specId:d.spec,remarks:f.remarks};}
 else if(t==='brand-delta'){type='SAVE_BRAND_DELTA';payload={itemId:d.item,branding:f.branding,decals:f.decals,packaging:f.packaging,labels:f.labels,colourNotes:f.colourNotes,remarks:f.remarks};}
 else if(t==='brand-artwork'){type='SUBMIT_BRAND_ARTWORK';payload={itemId:d.item,remarks:f.remarks,fileId:await upload(file,[])};}
 else if(t==='template-field'){type='SAVE_TEMPLATE_FIELD';payload={templateId:d.template,key:f.key,label:f.label,group:f.group,fieldType:f.fieldType,options:f.options,required:all.has('required'),active:true};}
 else if(t==='item-edit'){type='SAVE_ITEM';payload={...f,id:d.item||null,active:all.has('active')};}
 else if(t==='vendor-edit'){type='SAVE_VENDOR';payload={...f,id:d.vendor||null};}
 else if(t==='vendor-request'){type='REQUEST_VENDOR_UPDATE';payload={vendorId:d.vendor,remarks:f.remarks};}
 else if(t==='category'){type='ADD_CATEGORY';payload=f;}
 else if(t==='route'){type='SAVE_ROUTE';payload={...f,id:d.route||null};}
 else if(t==='policy'){type='SAVE_SETTINGS';payload={warningDays:Number(f.warningDays),bookingLeadDays:Number(f.bookingLeadDays),allowPreviousApprovedSpec:all.has('allowPreviousApprovedSpec')};}
 else if(t==='import'){type='COMMIT_IMPORT';payload={rows:ui.importRows,filename:ui.importFile.name,sourceFileId:await upload(ui.importFile,[])};}
 if(type)await command(type,payload);
 }catch(e){showError(e.message);}}
async function onClick(event){const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const d=el.dataset,a=d.action;try{
 if(a==='nav')navigate(d.to);
 else if(a==='open-order'){ui.tab='overview';ui.revision=null;navigate('order/'+d.id);}
 else if(a==='open-product'){ui.plmTab='products';navigate('product/'+d.id);}
 else if(a==='mobile'){ui.mobile=!ui.mobile;render();}
 else if(a==='close')closeModal();
 else if(a==='tab'){ui.tab=d.value;ui.revision=null;render();}
 else if(a==='master-tab'){ui.masterTab=d.value;ui.page=1;render();}
 else if(a==='plm-tab'){ui.plmTab=d.value;ui.page=1;render();}
 else if(a==='layout'){ui.layout=d.value;render();}
 else if(a==='page'){ui.page=Number(d.page);render();}
 else if(a==='submit-po')await command('SUBMIT_ORDER',{orderId:d.id});
 else if(a==='approve-po')await command('APPROVE_ORDER',{orderId:d.id},{message:'PO issued with a fixed specification snapshot.'});
 else if(a==='verify-pi')await command('VERIFY_PI',{orderId:d.id});
 else if(a==='approve-pi')await command('APPROVE_PI',{orderId:d.id});
 else if(a==='approve-amendment')await command('APPROVE_AMENDMENT',{orderId:d.id},{message:'New PO revision issued. Supplier confirmation and PI re-verification are required.'});
 else if(a==='authorize-payment')await command('AUTHORIZE_PAYMENT',{orderId:d.id,termIndex:Number(d.term),shipmentId:d.shipment||null});
 else if(a==='approve-artwork')await command('APPROVE_ARTWORK',{orderId:d.id});
 else if(a==='approve-spec')await command('APPROVE_SPEC',{baseId:d.base,specId:d.spec},{message:'PLM technical revision approved for procurement.'});
 else if(a==='approve-brand-delta')await command('APPROVE_BRAND_DELTA',{itemId:d.item},{message:'Brand-specific PLM differences approved.'});
 else if(a==='approve-brand-artwork')await command('APPROVE_BRAND_ARTWORK',{itemId:d.item,artworkId:d.artwork},{message:'Brand artwork revision approved.'});
 else if(a==='print')printPO(getOrder(d.id));
 else if(a==='file')await openFile(d.file);
 else if(a==='template')await template();
 else if(a==='export-orders')exportOrders();
 else if(a==='export-edits')csv('FH_Software_Edit_Log_'+APP_VERSION+'.csv',['Edit ID','Area','Change','Files','Software version','Acceptance'],EDITS.map(r=>[...r,APP_VERSION,'Management UAT pending']));
 else if(a==='export-import')csv('FH_Item_Import_Validation.csv',['Source row','Item code','Result','Errors','Warnings'],previewImport(state,ui.importRows||[]).map(r=>[r.row,r.normalized.code,r.result,r.errors.join('; '),r.warnings.join('; ')]));
 else if(a==='backup')await backup();
 else if(a==='reset'&&sandbox){if(confirm('Reset this browser review data? Export your backup first. Your live VMS is not affected.')){const next=createSeed();persist(next);state=next;user=state.users.find(u=>u.id===user.id)||state.users[1];render();toast('Review data reset. Live systems were not touched.');}}
 else if(a==='logout'){await api('/logout',{method:'POST',body:'{}'});state=null;user=null;csrf=null;loginView();}
 else if(a==='add-line'){ui.draft.lines.push({itemId:'',quantity:1,unitPrice:'0.00',specId:'',artworkNotes:''});renderModal();}
 else if(a==='remove-line'){ui.draft.lines.splice(Number(d.index),1);renderModal();}
 else if(a==='add-payline'){ui.payment.allocations.push({orderId:'',termKey:'',amount:'',invoiceRate:'1'});renderModal();}
 else if(a==='remove-payline'){ui.payment.allocations.splice(Number(d.index),1);renderModal();}
 else if(['new-order','edit-draft','pi','supplier','artwork-confirm','amendment','start-production','complete-production','commitment','artwork','task','task-complete','note','shipment','qc','shipment-update','dispatch','arrival','bl','document','short-close','cancel-shipment','return-po','void-payment','cost','payment','receipt','base','spec','plm-base','plm-revision','plm-successor','reject-spec','brand-delta','brand-artwork','template-field','item-edit','vendor-edit','vendor-request','vendor-view','category','route','policy','import'].includes(a))showDialog(a,d);
 }catch(e){showError(e.message);}}
async function onChange(event){const el=event.target,d=el.dataset;try{
 if(el.id==='demo-role'&&sandbox){user=state.users.find(u=>u.id===el.value);localStorage.setItem(STORE+'-user',user.id);closeModal();render();}
 else if(['status-filter','task-status','shipment-status'].includes(el.id)){ui.status=el.value;ui.page=1;render();}
 else if(el.id==='category-filter'){ui.category=el.value;ui.page=1;render();}
 else if(el.id==='revision-select'){ui.revision=Number(el.value);render();}
 else if(d.draft){ui.draft[d.draft]=el.value;if(d.draft==='vendorId'){const v=state.vendors.find(v=>v.id===el.value);ui.draft.productionDays=v.productionDays;ui.draft.currency=v.currency;ui.draft.paymentTerms=structuredClone(TERMS.find(t=>t.id===v.defaultTerms)||TERMS[0]);ui.draft.lines=[{itemId:'',quantity:1,unitPrice:'0.00',specId:'',artworkNotes:''}];renderModal();}}
 else if(d.template==='terms'){ui.draft.paymentTerms=structuredClone(TERMS.find(t=>t.id===el.value));renderModal();}
 else if(d.line!==undefined){const l=ui.draft.lines[Number(d.line)];l[d.key]=el.value;if(d.key==='itemId'){const i=state.items.find(i=>i.id===el.value),b=state.bases.find(b=>b.id===i?.baseId);l.specId=b?.specifications.filter(s=>s.status==='APPROVED').at(-1)?.id||'';l.artworkNotes=i?.artworkNotes||'';renderModal();}}
 else if(d.pay){ui.payment[d.pay]=el.value;if(d.pay==='currency')renderModal();}
 else if(d.payline!==undefined){const a=ui.payment.allocations[Number(d.payline)];a[d.key]=el.value;if(d.key==='orderId'){a.termKey='';renderModal();}}
 else if(d.userScope){const u=state.users.find(u=>u.id===d.userScope),scopes=el.checked?[...u.scopes,d.scope]:u.scopes.filter(s=>s!==d.scope);await command('SAVE_SCOPES',{userId:u.id,scopes},{message:'Division / purchase-type access updated.'});}
 else if(el.id==='item-import-file'){const file=el.files[0];ui.importRows=await readWorkbook(file);ui.importFile=file;renderModal();}
 }catch(e){showError(e.message);}}
function onInput(event){const el=event.target,d=el.dataset;if(el.id==='view-search'){const p=el.selectionStart;ui.search=el.value;ui.page=1;render();const e=$('#view-search');e?.focus();e?.setSelectionRange(p,p);}else if(d.draft)ui.draft[d.draft]=el.value;else if(d.line!==undefined)ui.draft.lines[Number(d.line)][d.key]=el.value;else if(d.term!==undefined)ui.draft.paymentTerms.steps[Number(d.term)][d.key]=el.value;else if(d.pay)ui.payment[d.pay]=el.value;else if(d.payline!==undefined)ui.payment.allocations[Number(d.payline)][d.key]=el.value;}
function loginView(error=''){$('#app').innerHTML=`<div class="login-page"><section class="login-brand"><div class="brand" style="padding:0 0 45px"><div class="brand-mark">${icon('leaf',26)}</div><span class="brand-name">Farming Hub</span></div><div class="eyebrow" style="color:#94b59b">Purchase management</div><h1>From supplier commitment<br>to port arrival.</h1><p>One place for orders, approved specifications, follow-ups and payment history. LAE Import comes first.</p></section><section class="login-form"><form class="login-card" id="login-form"><h2>Welcome to your workspace</h2><p>Sign in with a local pilot account. Existing live VMS accounts are not connected to this build.</p>${error?`<div class="form-error visible">${esc(error)}</div>`:''}${field('email','Email','','email',{required:true})}${field('password','Password','','password',{required:true,attrs:'autocomplete="current-password"'})}<button class="button primary" type="submit">Sign in ${icon('arrow',15)}</button><p style="font-size:10px;margin-top:24px">Setup instructions are in the source package. No shared production password is provided.</p></form></section></div>`;}
document.addEventListener('click',onClick);document.addEventListener('submit',onSubmit);document.addEventListener('change',onChange);document.addEventListener('input',onInput);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)closeModal();if(e.key==='Enter'&&e.target.id==='global-search'){const q=e.target.value.toLowerCase(),o=visibleOrders().find(o=>[o.number,...o.lines.map(l=>l.code)].join(' ').toLowerCase().includes(q));if(o){ui.tab='overview';navigate('order/'+o.id);}else{ui.view='items';ui.masterTab='items';ui.search=e.target.value;render();}}if(e.key==='Tab'&&ui.modal){const ns=[...$('#modal-root').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')];if(e.shiftKey&&document.activeElement===ns[0]){e.preventDefault();ns.at(-1)?.focus();}else if(!e.shiftKey&&document.activeElement===ns.at(-1)){e.preventDefault();ns[0]?.focus();}}if(['Enter',' '].includes(e.key)&&e.target.matches('.board-card')){e.preventDefault();ui.tab='overview';navigate('order/'+e.target.dataset.id);}});
window.addEventListener('hashchange',route);window.addEventListener('storage',e=>{if(sandbox&&e.key===STORE){try{const s=JSON.parse(e.newValue);if(s?.schemaVersion===1){state=s;user=state.users.find(u=>u.id===user.id);render();toast('Review workspace refreshed from another tab.');}}catch{}}});
start().catch(e=>{$('#app').innerHTML=empty('Workspace could not start',e.message);});
</script></body></html>
