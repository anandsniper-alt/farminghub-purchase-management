server {
    listen 80;
    server_name _;
 
    root /usr/share/nginx/html;
    index index.html;
 
    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
 
    client_max_body_size 20m;
 
    # API -> backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
 
    # Uploaded photos -> backend static
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
 
    # Cache hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
 
    # PWA manifest — correct MIME for reliable installability
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
 
    # Service worker must always be revalidated so updates roll out promptly
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
 
    # Android APK download (correct MIME + force download)
    location /downloads/ {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment";
    }
 
    # Digital Asset Links (verifies the Android app <-> domain for TWA)
    location = /.well-known/assetlinks.json {
        default_type application/json;
    }
 
    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
