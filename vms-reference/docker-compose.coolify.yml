# Coolify deployment compose for operations.farminghub.in
# (Local dev uses docker-compose.yml. This variant uses Coolify's proxy:
#  no host port publishing, and the frontend domain is bound via the
#  SERVICE_FQDN_FRONTEND_80 magic variable.)
 
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fhvms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-fh_vms}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fhvms}']
      interval: 10s
      timeout: 5s
      retries: 10
 
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fhvms}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-fh_vms}?schema=public
      JWT_SECRET: ${JWT_SECRET:-REPLACE_BEFORE_USE}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://operations.farminghub.in}
      UPLOAD_DIR: uploads
      UPLOAD_URL_PATH: /uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrator}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@farminghub.in}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-REPLACE_BEFORE_USE}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - '8000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
 
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Coolify binds this domain to the frontend container's port 80
      SERVICE_FQDN_FRONTEND_80: ${SERVICE_FQDN_FRONTEND_80:-}
    expose:
      - '80'
 
volumes:
  db_data:
  uploads_data:
