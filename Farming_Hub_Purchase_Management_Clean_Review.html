/* ========================================================================== 
   FARMING HUB BRAND GUIDELINES — v0.3.3-alpha.6
   Source of truth: docs/brand/Farming_Hub_Brand_Guidelines.pdf
   Primary: #204321 / #C5DA41. Preferred typeface: AmsiPro.
   Secondary: #EEBF9E #F47422 #D99B9A #60BB46 #EDF2C0 #EBBE87.
   Logo is used unchanged with clear space, preserved proportions and no effects.
   ========================================================================== */
:root{
  --fh-green:#204321;
  --fh-lime:#C5DA41;
  --fh-peach:#EEBF9E;
  --fh-orange:#F47422;
  --fh-rose:#D99B9A;
  --fh-leaf:#60BB46;
  --fh-pale:#EDF2C0;
  --fh-tan:#EBBE87;
  --bg:#f7f8f1;
  --white:#ffffff;
  --text:#203a25;
  --muted:#748176;
  --line:#e3e8dc;
  --green:var(--fh-green);
  --dark:var(--fh-green);
  --pale:#f2f5dd;
  --red:#a64d48;
  --amber:#9a6a19;
  --radius:14px;
  --side:246px;
  --fh-shadow:0 8px 26px rgba(32,67,33,.065);
  --fh-shadow-sm:0 3px 14px rgba(32,67,33,.05);
}
html{background:var(--bg)}
body{
  background:linear-gradient(180deg,#fbfbf7 0,#f7f8f1 20rem,#f5f7ee 100%);
  color:var(--text);
  font-family:AmsiPro,'Amsi Pro','Trebuchet MS','Segoe UI',Arial,sans-serif;
}
button,input,select,textarea{font-family:inherit}
h1,h2,h3,.brand-name,.kpi-value,.trend-value{font-family:AmsiPro,'Amsi Pro','Trebuchet MS','Segoe UI',Arial,sans-serif}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(197,218,65,.72);outline-offset:2px}
a{color:var(--fh-green)}

/* Brand structure / official logo */
.sidebar{
  background:var(--fh-green);
  color:#e8eddd;
  border-right:0;
  box-shadow:none;
  overflow:hidden;
}
.sidebar:before,.sidebar:after{
  content:'';position:absolute;pointer-events:none;z-index:0;
  background:var(--fh-lime);opacity:.08;
}
.sidebar:before{width:240px;height:150px;right:-125px;top:86px;border-radius:72% 0 65% 28%;transform:rotate(-17deg)}
.sidebar:after{width:200px;height:92px;left:-92px;bottom:110px;border-radius:0 75% 18% 70%;transform:rotate(14deg)}
.sidebar>*{position:relative;z-index:1}
.brand-logo-block{display:block;padding:0 8px 26px}
.brand-logo-shell{
  display:flex;align-items:center;justify-content:center;
  background:#fff;border:1px solid #eef0e8;border-radius:10px;
  padding:12px 14px;max-width:202px;box-shadow:none;
}
.brand-logo{display:block;width:100%;height:auto;max-height:54px;object-fit:contain}
.brand-logo-block .brand-sub{margin:9px 3px 0;color:#d7dfca;font-size:9px;font-weight:700;letter-spacing:1.65px;text-transform:uppercase}
.nav-label{color:#b9c5ad;font-weight:700;letter-spacing:1.55px}
.nav-link{color:#e0e6d8;border:1px solid transparent;transition:background .15s ease,color .15s ease}
.nav-link:hover{background:rgba(237,242,192,.10);color:#fff;transform:none}
.nav-link.active{background:var(--fh-lime);color:var(--fh-green);font-weight:700;border-color:var(--fh-lime);box-shadow:none;position:relative}
.nav-link.active:before{content:'';position:absolute;left:-5px;top:8px;bottom:8px;width:3px;border-radius:4px;background:#fff}
.nav-count{background:rgba(255,255,255,.12);color:#fff}
.nav-link.active .nav-count{background:rgba(32,67,33,.12);color:var(--fh-green)}
.sidebar-note{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.17);color:#ccd7c4}
.sidebar-note b{color:#fff}.version-mini{color:#b7c4ad}

/* Header / layout */
.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);box-shadow:none}
.topbar:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--fh-lime)}
.breadcrumb{color:#829085}.breadcrumb b{color:var(--fh-green);font-weight:700}
.search-top{border-color:#dfe5d8;background:#fff;border-radius:9px}
.avatar{background:var(--fh-pale);color:var(--fh-green);border:1px solid #dce4ac}
.account select{color:var(--fh-green)}
.content{padding-top:31px}
.page-head{margin-bottom:25px}.page-head h1{font-size:30px;font-weight:800;color:var(--fh-green);letter-spacing:-.8px}
.eyebrow{color:#527027;font-weight:800;letter-spacing:1.65px}
.subtitle{color:var(--muted)}

/* Controls */
.button{border:1px solid #dce4d4;border-radius:9px;background:#fff;color:var(--fh-green);box-shadow:none;font-weight:650}
.button:hover{border-color:#aabd71;background:#fbfceF;transform:none}
.button.primary{background:var(--fh-green);border-color:var(--fh-green);color:#fff;box-shadow:none}
.button.primary:hover{background:#17361b;border-color:#17361b}
.button.danger{background:#fff6f1;border-color:#efc8b6;color:#98472d}
.button.ghost{background:transparent}
.icon-button{border-color:#dfe5d8;color:var(--fh-green);border-radius:8px}
.filters input,.filters select,.select-small,.search-top,input,select,textarea{accent-color:var(--fh-lime)}
.filters input,.filters select,.select-small{border-color:#dfe5d8;border-radius:8px;background:#fff;color:#405945}
.segmented{border-color:#dfe5d8;border-radius:8px}.segmented button.active{background:var(--fh-pale);color:var(--fh-green);font-weight:700}

/* Cards / tables */
.scope-row{gap:15px}.scope-card{border-radius:13px;border-color:var(--line);box-shadow:var(--fh-shadow-sm);color:#506756}
.scope-card.active{background:#fbfceF;border-color:#cbd98b;box-shadow:inset 4px 0 var(--fh-lime),var(--fh-shadow-sm)}
.scope-card .value{color:var(--fh-green);font-weight:800}
.kpi-grid{gap:16px}.kpi{border-radius:14px;border-color:var(--line);box-shadow:var(--fh-shadow-sm);position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--fh-lime)}
.kpi-icon{background:var(--fh-pale);color:var(--fh-green);border-radius:8px}
.kpi-value{color:var(--fh-green);font-weight:800}
.kpi.red .kpi-icon{background:#fff0e7;color:var(--fh-orange)}.kpi.red .kpi-value{color:#9d4f33}
.panel{border-radius:14px;border-color:var(--line);box-shadow:var(--fh-shadow)}
.panel-head{background:#fff;padding:20px 22px}.panel-head h2{color:var(--fh-green);font-weight:800}
.panel-footer{background:#fbfcf7}
.tabs{border-bottom-color:#dfe5d8}.tab{font-weight:650}.tab.active{border-color:var(--fh-lime);color:var(--fh-green);font-weight:800}
table thead th{background:#f2f5dd;color:#52664f;font-weight:800}
table tbody tr:hover{background:#fcfdf6}.code-link{color:var(--fh-green)}
.pipeline-bars .bar{background:#eef1e8}.pipeline-bars .bar i{background:var(--fh-leaf)}
.bar-line:nth-child(2) i{background:var(--fh-green)}.bar-line:nth-child(3) i{background:var(--fh-lime)}.bar-line:nth-child(4) i{background:var(--fh-tan)}.bar-line:nth-child(5) i{background:var(--fh-orange)}

/* Status vocabulary uses the approved secondary palette. */
.badge{border-radius:999px;padding:4px 8px;font-weight:750}
.badge.green{background:#edf7e9;color:#337630}.badge.blue{background:var(--fh-pale);color:#526a25}.badge.amber{background:#fff3df;color:#8a5a12}.badge.red{background:#fbe9e7;color:#984b46}.badge.dark{background:#edf0e8;color:#566557}
.flag-icon{border-radius:8px;background:#fff0e8;color:var(--fh-orange)}.flag-icon.warning{background:#fff3df;color:#a56a16}
.flag-title{color:#405b45}.demo-strip{background:#fbf8e8;border-color:#e8ddb2;color:#806e42;border-radius:9px}

/* Shipping / trends */
.ship-milestone.done{border-left-color:var(--fh-leaf);background:#f7fbf2}.ship-milestone.done>span{background:#edf7e9;color:#357b39;border-color:#bdd9ad}
.ship-milestone.active{border-left-color:var(--fh-orange);background:#fff8ef}.ship-milestone.active>span{background:#fff0e7;border-color:#efc29e}.ship-milestone.active b{color:#8c551c}
.trend-card{background:#fff;border-color:var(--line);box-shadow:var(--fh-shadow-sm)}.trend-value{color:var(--fh-green);font-weight:800}

/* Brand-element curves: based on the guidelines' scalable spark/curve language. */
.page-head:after{
  content:'';display:block;width:54px;height:13px;margin-left:auto;margin-top:2px;
  background:var(--fh-lime);border-radius:75% 18% 70% 25%;transform:rotate(-8deg);opacity:.95;flex:0 0 auto;
}
.panel.brand-accent{position:relative;overflow:hidden}.panel.brand-accent:after{content:'';position:absolute;width:130px;height:50px;right:-38px;bottom:-26px;background:var(--fh-pale);border-radius:70% 0 0 0;pointer-events:none}

/* Login follows the approved white / primary-green / lime language. */
.login-page{background:#f8f9f1}
.login-brand{background:var(--fh-green);position:relative;overflow:hidden}
.login-brand:before,.login-brand:after{content:'';position:absolute;pointer-events:none;background:var(--fh-lime)}
.login-brand:before{width:360px;height:210px;right:-140px;top:68px;border-radius:70% 0 65% 20%;transform:rotate(-10deg);opacity:.12}
.login-brand:after{width:430px;height:180px;left:-160px;bottom:-75px;border-radius:0 75% 25% 65%;transform:rotate(7deg);opacity:.10}
.login-brand>*{position:relative;z-index:1}
.login-logo-block{display:block}
.login-logo-shell{display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid #eef0e8;border-radius:11px;padding:14px 17px;box-shadow:none}
.login-brand-logo{display:block;width:min(300px,54vw);height:auto;max-height:88px;object-fit:contain}
.login-brand h1{font-size:46px;line-height:1.08;max-width:650px;letter-spacing:-1.5px;color:#fff;font-weight:800}
.login-brand p{color:#d8e2d0;max-width:570px}.login-form{background:#f8f9f1}
.login-card{border-radius:16px;box-shadow:var(--fh-shadow);border-color:#dfe5d8}

/* Logo integrity: white background, clear zone, no recolor / distortion / effects. */
.brand-logo-shell,.login-logo-shell,.print-logo-shell{background:#fff}
.brand-logo,.login-brand-logo,.print-logo{filter:none!important;transform:none!important;opacity:1!important;box-shadow:none!important}
.print-logo{display:block;width:152px;height:auto;max-height:50px;object-fit:contain;margin:0 0 12px}

/* Printing stays clean and brand-compliant. */
@media print{
  body{background:#fff;color:#202d23;font-family:AmsiPro,'Amsi Pro','Trebuchet MS','Segoe UI',Arial,sans-serif}
  .print-logo{width:145px;max-height:48px}
  .print-head{border-bottom:3px solid var(--fh-lime);padding-bottom:12px}
}
@media(max-width:900px){.topbar{height:70px}.page-head h1{font-size:26px}.login-brand h1{font-size:36px}.brand-logo-shell{max-width:190px}.login-brand-logo{width:min(250px,66vw)}}
@media(max-width:720px){.brand-logo-block{padding-bottom:18px}.brand-logo-shell{max-width:178px}.login-logo-shell{padding:11px 13px}.login-brand-logo{width:min(220px,72vw)}.page-head:after{display:none}}

/* Supplier price-list module */
.price-warning{display:block;margin-top:7px;color:#8a4d13;font-weight:700}

@media(max-width:720px){.current-stage-card{align-items:flex-start;flex-direction:column}}

function templateForCategory(state, category){
  const c=String(category||'').trim().toUpperCase();
  return state.plmTemplates?.find(t=>t.active!==false&&String(t.category).toUpperCase()===c)
    ||state.plmTemplates?.find(t=>t.active!==false&&t.category==='*')||null;
}
function specDescriptionFromValues(template, values={}){
  if(!template)return '';
  const groups=[];
  for(const f of template.fields.filter(f=>f.active!==false)){
    const v=String(values[f.key]??'').trim();
    if(!v)continue;
    let g=groups.find(x=>x.name===f.group);if(!g){g={name:f.group,lines:[]};groups.push(g);}
    g.lines.push(`${f.label}: ${v}`);
  }
  return groups.map(g=>`${g.name}\n${g.lines.join('\n')}`).join('\n\n');
}
function brandDeltaSummary(delta={}){
  const colours=[
    delta.primaryColourName&&`Primary colour: ${delta.primaryColourName}${delta.primaryColourCode?' · '+delta.primaryColourCode:''}${delta.primaryColourComponents?' · '+delta.primaryColourComponents:''}`,
    delta.secondaryColourName&&`Secondary colour: ${delta.secondaryColourName}${delta.secondaryColourCode?' · '+delta.secondaryColourCode:''}${delta.secondaryColourComponents?' · '+delta.secondaryColourComponents:''}`
  ].filter(Boolean).join('\n');
  return [
    ['Branding',delta.branding],['Sticker / decal',delta.decals],['Sticker application',delta.stickerApplication],
    ['Embossing',delta.embossing],['Packaging / carton',delta.packaging],['Labels',delta.labels],
    ['Colour mapping',colours||delta.colourNotes],['Other brand-specific changes',delta.remarks]
  ].filter(([,v])=>String(v||'').trim()).map(([k,v])=>`${k}: ${String(v).trim()}`).join('\n');
}
function qcChecklistForSpec(template,values={},phase='PREPRODUCTION'){
  if(!template)return [];
  const flag=phase==='BULK'?'qcBulk':'qcPreproduction';
  return template.fields.filter(f=>f.active!==false&&f[flag]).map(f=>({key:f.key,label:f.label,value:String(values[f.key]??'').trim(),group:f.group,required:!!f.required}));
}
function poFieldsForSpec(template,values={}){
  if(!template)return [];
  return template.fields.filter(f=>f.active!==false&&f.poPrint).map(f=>({key:f.key,label:f.label,value:String(values[f.key]??'').trim(),group:f.group}));
}
function supplierConfirmationFields(template,values={}){
  if(!template)return [];
  return template.fields.filter(f=>f.active!==false&&f.supplierConfirm).map(f=>({key:f.key,label:f.label,value:String(values[f.key]??'').trim(),group:f.group}));
}

const masterNorm = v => String(v ?? '').toUpperCase().replace(/[^A-Z0-9]/g,'');
const majorToMinor = v => Math.round(Number(v||0)*100);
function applyFinalMasterData(state,today='2026-09-12'){
  const vendorFor = code => state.vendors.find(v =>
    [v.code,v.fullReference,v.vendorSerial,v.fixedSupplierCode,(v.vendorSerial||'')+(v.fixedSupplierCode||'')]
      .some(x => masterNorm(x)===masterNorm(code))
  );
  const activeBrands = state.brands.filter(b=>b.active && ['GJ','KD','TT'].includes(b.prefix));
  state.bases = [];
  state.items = [];
  state.priceLists = [];
  for(const row of FINAL_BASE_ITEMS){
    const vendor=vendorFor(row.vendorCode);
    // The first Item Master sheet is authoritative even where supplier is blank.
    // Unassigned bases remain visible but are not eligible for a PO until a supplier is mapped.
    const template = state.plmTemplates.find(t=>t.active!==false && String(t.category).toUpperCase()===row.category)

      description:row.description,category:row.category,family:row.classification||row.category,
      grade:row.grade,engine:row.engine,vendorId:vendor?.id||null,scope:'LAE_IMPORT',
      productionDays:row.productionDays,productionDaysIsReference:true,
      templateId:template?.id||'tpl-generic-lae',previousBaseId:null,
      creationReason:'Imported from final ITEM MASTER.xlsx supplied by Farming Hub.',
      lifecycleStatus:'ACTIVE',specifications:[],at:today+'T00:00:00.000Z',
      source:'ITEM MASTER.xlsx · first sheet is the final Base Item Master'
    });
    for(const brand of activeBrands){
      const itemId='erp-'+brand.prefix.toLowerCase()+'-'+row.baseItemCode.toLowerCase().replace(/[^a-z0-9]+/g,'-');
      state.items.push({
        id:itemId,code:`${brand.prefix}-${row.baseItemCode}`,erpItemCode:`${brand.prefix}-${row.baseItemCode}`,
        baseItemCode:row.baseItemCode,name:row.name,description:row.description,category:row.category,
        baseId,vendorCode:vendor?.code||'',brand:brand.name,brandPrefix:brand.prefix,

        active:true,status:'ERP_CODE_READY',scope:'LAE_IMPORT',source:'Generated from final Base Item Master'
      });
    }
  }
  for(const p of FINAL_BASE_PRICES){
    const base=state.bases.find(b=>b.code===p.baseItemCode);
    const vendor=vendorFor(p.vendorCode)||state.vendors.find(v=>v.id===base?.vendorId);
    if(!base||!vendor) continue;
    state.priceLists.push({
      id:`price-${p.baseItemCode}-${p.currency}`.toLowerCase(),
      vendorId:vendor.id,baseId:base.id,baseItemCode:base.code,itemId:null,currency:p.currency,
      unitPriceMinor:majorToMinor(p.unitPrice),effectiveDate:today,remarks:'Imported from PRICE LIST MASTER; rows outside the final Base Item Master were ignored.',

      at:today+'T00:00:00.000Z',by:'System import',source:'User-supplied final price list'
    });
  }
  const routeDefs=[
    ['NINGBO','', 'CHENNAI'],['QINGDAO','', 'CHENNAI'],['SHENZHEN','', 'CHENNAI'],
    ['CHONGQING','NINGBO','CHENNAI'],['CHONGQING','NANSHA','CHENNAI'],['CHONGQING','QINZHOU','CHENNAI'],['CHONGQING','SHEKOU','CHENNAI']
  ];
  state.routes=routeDefs.map(([origin,via,destination],idx)=>({
    id:`route-final-${idx+1}`,name:`${origin}${via?' via '+via:''} → ${destination}`,origin,via,destination,transitDays:1,
    rateRouteKey:[origin,via?'VIA '+via:'',destination,'1X40HC'].filter(Boolean).join('|'),
    source:'Route created from WEEKLY BUY RATE history. Transit days are reference placeholders; manual total planning TAT remains explicit.'
  }));
  state.freightRates = FREIGHT_HISTORY.map((r,idx)=>({
    id:`freight-history-${idx+1}`,batchId:`freight-history-${r.sequence}`,weekCode:r.weekCode,
    sequence:r.sequence,routeKey:[r.origin,r.via?'VIA '+r.via:'',r.destination,r.containerType].filter(Boolean).join('|'),

    agentChargeUsd:r.agentChargeUsd,benchmarkUsd:r.benchmarkUsd,schedule:r.schedule,
    importedAt:today+'T00:00:00.000Z',importedBy:'System import',source:r.source
  }));
  state.freightImports = [{
    id:'freight-history-final',weekCode:'HISTORICAL + LATEST',sourceFileId:null,
    filename:'WEEKLY BUY RATE.xlsx',at:today+'T00:00:00.000Z',by:'System import',
    count:state.freightRates.length,notes:'24 historical rate snapshots retained in workbook order. Agent charge: USD 60 below USD 3,000; USD 120 from USD 3,000 upward.'
  }];
  state.imports = [{
    id:'item-master-final',sourceFileId:null,filename:'ITEM MASTER.xlsx',templateVersion:'Final Base Item Master',
    mappingVersion:'base-item-to-erp-item-v1',at:today+'T00:00:00.000Z',by:'System import',
    count:FINAL_BASE_ITEMS.length,rows:[],notes:'First sheet treated as final Base Item Master. Three ERP Item Codes generated per base item: GJ-, KD-, TT-.'
  }];
  state.complaints = state.complaints || [];
  state.seededEventCount = state.events.length;
  return state;
}

function shipmentCard(o,s){const ed=canEdit(user,o),open=s.status!=='CANCELLED',rv=rateVariance(state,s),missing=shippingDocReadiness(o,s),milestones=milestoneRows(s);const rate=latestRateFor(state,s);return `<div class="panel" style="margin-bottom:18px">${ph(`<span class="code-link">${esc(s.number)}</span> &nbsp; ${badge(s.bookingStatus||s.status,s.actualArrival?'green':s.actualDeparture?'blue':s.bookingStatus==='RELEASED'?'amber':'dark')}`,`${esc(o.number)} · ${esc(s.container||'Container not released')} · ${s.lines.reduce((n,l)=>n+l.quantity,0)} units`,button('Order','open-order',{id:o.id},'small ghost','arrow'))}<div class="shipment-facts">${kv('Forwarder Ref',esc(s.forwarderRef||'Not booked'))}${kv('Forwarder',esc(state.vendors.find(v=>v.id===s.forwarderId)?.name||'Not assigned'))}${kv('Booked freight',s.bookedFreightUsdMinor?formatMoney(s.bookedFreightUsdMinor,'USD'):'Not booked')}${kv('Latest weekly rate',rate?'USD '+Number(rate.rateUsd).toLocaleString('en-IN')+' · '+esc(rate.weekCode):'No matched rate')}${kv('Route',esc([s.origin,s.via?`via ${s.via}`:'',s.destination].filter(Boolean).join(' → ')))}${kv('Vessel / voyage',esc([s.vessel,s.voyage].filter(Boolean).join(' · ')||'Required before vessel loading'))}${kv('Baseline → current ETD',sd(s.baselineEtd)+' → <b class="'+(s.etd!==s.baselineEtd?'revised-date':'')+'">'+sd(s.etd)+'</b>')}${kv('Loaded on vessel',dt(s.actualDeparture))}${kv('Baseline → current ETA',sd(s.baselineEta)+' → <b class="'+(s.eta!==s.baselineEta?'revised-date':'')+'">'+sd(s.eta)+'</b>')}${kv('India port arrival',dt(s.actualArrival))}${kv('Final BL',s.blNumber?esc(s.blNumber)+' · '+dt(s.blDate):badge('Pending after vessel loading','amber'))}${kv('Insurance',s.insurance?badge('Completed','green'):s.blNumber?badge('Pending after final BL','amber'):badge('Awaiting final BL','dark'))}</div>${rv?.flag?`<div style="margin:12px 18px">${note(`<b>Freight warning:</b> booked USD ${rv.booked.toFixed(0)} vs latest weekly USD ${rv.market.toFixed(0)}. Difference +USD ${rv.difference.toFixed(0)} exceeds the USD ${state.settings.freightWarningUsd} threshold. Check whether cancellation / rebooking is still feasible.`,'warn')}</div>`:''}<div class="shipping-milestones">${milestones.map(m=>`<div class="ship-milestone ${m.actualDate?'done':m.estimatedDate?'active':''}"><span>${m.actualDate?icon('check',11):''}</span><div><b>${esc(m.label)}</b><small>${m.actualDate?dt(m.actualDate):m.estimatedDate?'Est. '+dt(m.estimatedDate):'Pending'}${m.location?' · '+esc(m.location):''}</small></div></div>`).join('')}</div>${s.alterations.length?`<div style="margin:12px 18px">${note(s.alterations.length+' specification/artwork alteration(s) remain visible for production / receipt verification.','warn')}</div>`:''}${missing.length&&!s.actualDeparture?`<div style="margin:12px 18px">${note('Before vessel loading: '+esc(missing.join(', ').replaceAll('_',' ')),'warn')}</div>`:''}${s.actualDeparture&&!s.blNumber?`<div style="margin:12px 18px">${note('Next required shipping action: record and verify the final BL.','warn')}</div>`:''}${s.blNumber&&!s.insurance?.insuredAt?`<div style="margin:12px 18px">${note('Next required shipping action: complete shipment insurance under the company master policy.','warn')}</div>`:''}<div class="ship-actions">${ed&&open&&s.bookingStatus==='PLANNED'?button('Book container','container-book',{id:o.id,shipment:s.id},'small primary','check'):''}${ed&&open&&s.bookingStatus==='BOOKED'?button('Container released','container-release',{id:o.id,shipment:s.id},'small primary','check'):''}${ed&&open&&!s.actualArrival?button('Tracking milestone','tracking-milestone',{id:o.id,shipment:s.id},'small','edit'):''}${ed&&open&&!s.actualArrival?button('Update ETD / ETA','shipment-update',{id:o.id,shipment:s.id},'small','edit'):''}${ed?button('Upload document','document',{id:o.id,shipment:s.id},'small','upload'):''}${ed&&open&&!s.actualDeparture?button('Verify BL draft (optional)','bl-draft',{id:o.id,shipment:s.id},'small','file'):''}${ed&&open&&!s.actualDeparture?button('Loaded on vessel','dispatch',{id:o.id,shipment:s.id},'small primary','ship'):''}${ed&&open&&s.actualDeparture&&!s.blNumber?button('Final BL / verify','bl',{id:o.id,shipment:s.id},'small primary','file'):''}${ed&&open&&s.blNumber&&!s.insurance?.insuredAt?button('Complete insurance','insurance',{id:o.id,shipment:s.id},'small primary','file'):''}${ed&&s.actualDeparture&&s.blNumber&&s.insurance?.insuredAt&&!s.actualArrival?button('India port arrival','arrival',{id:o.id,shipment:s.id},'small primary','check'):''}${canApprove(user)&&open&&!s.actualDeparture?button('Cancel allocation','cancel-shipment',{id:o.id,shipment:s.id},'small danger'):''}</div>${s.lastForwarderStatus?`<div class="panel-footer"><b>Latest forwarder Excel:</b> ${esc(s.lastForwarderStatus)} · ${dt(s.lastForwarderUpdateAt)}</div>`:''}</div>`;}

function orderDocuments(o){return `<div class="panel">${ph('Order and shipment evidence','Actual selected files with order / shipment / revision references.',canEdit(user,o)?button('Upload document','document',{id:o.id},'small primary','upload'):'')}<div class="document-list">${o.documents.map(d=>`<div class="doc-card"><div class="doc-symbol">${icon('file',18)}</div><div style="min-width:0;flex:1"><h3 title="${esc(d.name)}">${esc(d.name)}</h3><p>${esc(d.type.replaceAll('_',' '))}<br>Rev ${d.revision} · ${sd(d.uploadedAt)}<br>${esc(d.uploadedBy)}</p></div><button class="icon-button" data-action="file" data-file="${d.fileId}" aria-label="Download evidence">${icon('download',13)}</button></div>`).join('')||empty('No files uploaded')}</div><div class="panel-footer">Shipment-specific regulatory requirements must be confirmed before live use; this is not a legal compliance certificate.</div></div>`;}
function orderHistory(o){const events=state.events.filter(e=>e.entityType==='order'&&e.entityId===o.id).slice().reverse();return `<div class="panel">${ph('One continuous order history',`${events.length} entries · earlier records are never silently replaced.`,canEdit(user,o)?button('Log interaction','note',{id:o.id},'small primary','plus'):'')}<div class="timeline">${events.map(e=>`<div class="timeline-event"><div class="timeline-marker">${icon(e.action.includes('PAYMENT')?'money':e.action.includes('APPROV')?'check':'history',12)}</div><div class="timeline-content"><div class="event-top"><span>${esc(e.actorName)} · ${esc(e.source||'User action')}</span><span>${dt(e.at)} · ${e.at.slice(11,16)} UTC</span></div><p><b>${esc(e.action.replaceAll('_',' '))}</b><br>${esc(e.summary)}</p>${e.oldValue||e.newValue?`<details><summary>View previous and new values</summary><pre>${esc(JSON.stringify({previous:e.oldValue,updated:e.newValue},null,2))}</pre></details>`:''}${canEdit(user,o)?button('Add correction note','note',{id:o.id,event:e.id},'small ghost'):''}</div></div>`).join('')}</div></div>`;}

function shippingTrackingPanel(rows){const batches=state.shippingImports||[];return `<div class="kpi-grid">${kpi('Active consignments',rows.filter(({s})=>s.status!=='ARRIVED'&&s.status!=='CANCELLED').length,'Ref-based manual tracking','ship')}${kpi('Booked / released',rows.filter(({s})=>['BOOKED','RELEASED'].includes(s.bookingStatus)).length,'Before vessel loading','box')}${kpi('On vessel / transit',rows.filter(({s})=>!!s.actualDeparture&&!s.actualArrival).length,'Vessel & voyage recorded','ship')}${kpi('Weekly tracking uploads',batches.length,'Previous status history retained','history')}</div><div class="panel" style="margin-bottom:20px">${ph('Weekly forwarding-agent report','Upload the VJ-style Excel. Ref is the primary match key; earliest planned ETD/ETA remain fixed.',canCreate(user)?button('Upload weekly tracking Excel','tracking-import',{},'small primary','upload'):'')}<div class="panel-body"><p class="small muted">Recognized fields: Supplier Name, Volume, Arrival Month, Invoice No, BL No, ETD, ETA, Status, Ref and Telex Status. Exact Ref matches are applied only after preview/confirmation.</p>${batches.slice(-3).reverse().map(b=>`<div class="history-row"><b>${esc(b.filename)}</b><span>${esc(b.statusDate||'')}</span><span>${b.matched} matched · ${b.unmatched} unmatched</span><span>${dt(b.at)}</span></div>`).join('')||'<p class="small muted">No weekly tracking file has been committed yet.</p>'}</div></div>${rows.map(({o,s})=>shipmentCard(o,s)).join('')||`<div class="panel">${empty('No shipments in this view','Plan shipments from issued purchase orders.','ship')}</div>`}`;}
function freightRatesPanel(){const all=state.freightRates||[],keys=[...new Set(all.map(r=>r.routeKey))],latest=keys.map(k=>all.filter(r=>r.routeKey===k).sort((a,b)=>(Number(a.sequence||0)-Number(b.sequence||0))||String(a.importedAt).localeCompare(String(b.importedAt))).at(-1)).filter(Boolean);return `<div class="kpi-grid">${kpi('Tracked freight routes',keys.length,'Exact route + via + destination + container type','ship')}${kpi('Latest benchmark rows',latest.length,'O/F + forwarding-agent charge','money')}${kpi('Agent-charge rule','USD 60 / 120','< 3,000 = 60 · ≥ 3,000 = 120','money')}${kpi('Rate warning threshold','USD '+state.settings.freightWarningUsd,'Booked freight > final benchmark by more than threshold','alert')}</div><div class="panel">${ph('Weekly freight buy-rate benchmark','Final benchmark = Ocean Freight + Agent Charge. Historical snapshots are never overwritten.',canCreate(user)?button('Upload weekly rate sheet','rate-import',{},'small primary','upload'):'')}<div class="table-wrap"><table><thead><tr><th>Route</th><th>Container</th><th>Week</th><th class="right">O/F USD</th><th class="right">Agent</th><th class="right">Final benchmark</th><th>Schedule</th><th>Trend</th></tr></thead><tbody>${latest.map(r=>{const tr=freightTrendFor(state,r.routeKey),agent=Number(r.agentChargeUsd??(Number(r.rateUsd)<3000?60:120)),benchmark=Number(r.benchmarkUsd??Number(r.rateUsd)+agent);return `<tr><td class="strong">${esc(r.origin)}${r.via?' via '+esc(r.via):''} → ${esc(r.destination)}</td><td>${esc(r.containerType)}</td><td>${esc(r.weekCode)}</td><td class="right">USD ${Number(r.rateUsd).toLocaleString('en-IN')}</td><td class="right">USD ${agent.toLocaleString('en-IN')}</td><td class="right strong">USD ${benchmark.toLocaleString('en-IN')}</td><td>${esc(r.schedule||'—')}</td><td>${badge(tr.direction,tr.direction==='RISING'?'red':tr.direction==='FALLING'?'green':'dark')}</td></tr>`;}).join('')||`<tr><td colspan="8">${empty('No freight rates','Upload the weekly forwarding-agent buy-rate sheet.','money')}</td></tr>`}</tbody></table></div></div>`;}
function freightTrendsPanel(){const all=state.freightRates||[],keys=[...new Set(all.map(r=>r.routeKey))];return `<div class="panel">${ph('Freight price trend & advance-booking watch','Trend uses the final benchmark (O/F + agent charge) and keeps every exact route separate.')}<div class="trend-grid">${keys.map(k=>{const tr=freightTrendFor(state,k),last=tr.recent.at(-1);const pending=visibleOrders().filter(o=>o.productionStartedAt&&!o.shipments.some(s=>s.status!=='CANCELLED'&&s.rateRouteKey===k)&&!o.productionCompletedAt).length;const latest=last?Number(last.benchmarkUsd??Number(last.rateUsd)+(Number(last.rateUsd)<3000?60:120)):null;return `<div class="trend-card"><div class="flex spread"><b>${esc(k.replaceAll('|',' · '))}</b>${badge(tr.direction,tr.direction==='RISING'?'red':tr.direction==='FALLING'?'green':'dark')}</div><div class="trend-value">${latest!==null?'USD '+latest.toLocaleString('en-IN'):'—'}</div><div class="sub">Latest final benchmark · O/F ${last?'USD '+Number(last.rateUsd).toLocaleString('en-IN'):'—'} + agent ${last?'USD '+Number(last.agentChargeUsd??(Number(last.rateUsd)<3000?60:120)).toLocaleString('en-IN'):'—'}</div><div class="sub" style="margin-top:7px">${tr.recent.map(r=>esc(r.weekCode)+': '+Number(r.benchmarkUsd??Number(r.rateUsd)+(Number(r.rateUsd)<3000?60:120)).toLocaleString('en-IN')).join(' · ')||'Only one snapshot available'}</div>${tr.direction==='RISING'&&pending?note(`${pending} active production order(s) on this exact route have no matching advance booking. Consider early booking while final benchmark rates are rising.`,'warn'):''}</div>`;}).join('')||empty('No rate history')}</div></div>`;}
function shipmentsView(){const rows=visibleOrders().flatMap(o=>o.shipments.map(s=>({o,s}))).filter(({s})=>!ui.status||s.status===ui.status),tabs=[['tracking','Container tracking'],['rates','Weekly freight rates'],['trends','Freight trends']];const content=ui.shippingTab==='rates'?freightRatesPanel():ui.shippingTab==='trends'?freightTrendsPanel():shippingTrackingPanel(rows);return head('LAE Import / Shipping','Shipping & freight control','Pre-production sample → bulk QC → production completion → booking/release → structured China legs → vessel → India port. Weekly Excel is the manual tracking heartbeat.')+`<div class="tabs">${tabs.map(([v,l])=>`<button class="tab ${ui.shippingTab===v?'active':''}" data-action="shipping-tab" data-value="${v}">${l}</button>`).join('')}</div>`+content;}

function approvalControlsPanel(){if(user.role!=='ADMIN')return '';const history=state.events.filter(e=>e.action==='APPROVAL_CONTROLS_UPDATED').slice().reverse();return '<div class="panel">'+ph('Approval controls','Manage who can approve each stage in LAE Import.',button('Manage approval controls','approval-controls',{},'primary','lock'))+'<div class="panel-body">'+note('Changes remain active until an administrator edits or restores them. There is no automatic September rule or expiry. Admin always retains approval access.','blue')+'<div class="gap"></div><div class="table-wrap"><table><thead><tr><th>Approval stage</th><th>Allowed roles</th></tr></thead><tbody>'+APPROVAL_STAGES.map(s=>'<tr><td>'+esc(s.label)+'<div class="sub">'+esc(s.group)+'</div></td><td>'+['ADMIN',...approvalRoles(state,s.command)].map(userRoleLabel).map(esc).join(', ')+(s.assignedExecutiveOnly?'<div class="sub">Executive: assigned orders only.</div>':'')+'</td></tr>').join('')+'</tbody></table></div><div class="gap"></div><h3>Approval control history</h3>'+(history.length?'<div class="table-wrap"><table><thead><tr><th>Date / administrator</th><th>Reason</th><th>Changes</th></tr></thead><tbody>'+history.map(e=>'<tr><td>'+esc(dt(e.at))+'<div class="sub">'+esc(e.actorName)+'</div></td><td>'+esc(e.newValue?.remarks||'')+'</td><td>'+APPROVAL_STAGES.filter(s=>JSON.stringify(e.oldValue?.stages?.[s.command]||s.roles)!==JSON.stringify(e.newValue?.stages?.[s.command]||[])).map(s=>esc(s.label)+': '+['ADMIN',...(e.oldValue?.stages?.[s.command]||s.roles)].map(userRoleLabel).map(esc).join(', ')+' &rarr; '+['ADMIN',...(e.newValue?.stages?.[s.command]||[])].map(userRoleLabel).map(esc).join(', ')).join('<br>')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="small muted">Standard roles are active. No approval control changes recorded.</p>')+'</div></div><div class="gap"></div>';}

ods||PAYMENT_METHODS).map(m=>`<tr><td class="strong">${esc(m.name)}</td><td>${esc(m.description||'')}</td></tr>`).join('')}</tbody></table></div></div><div class="panel">${ph('Port master','Export ports from the supplier master workbook plus the destination port.')}<div class="table-wrap"><table><thead><tr><th>Port</th><th>Country</th><th>Type</th></tr></thead><tbody>${(state.ports||PORTS).map(p=>`<tr><td class="strong">${esc(p.displayName||p.name)}</td><td>${esc(p.country)}</td><td>${badge(p.type,p.type==='EXPORT'?'green':'blue')}</td></tr>`).join('')}</tbody></table></div></div></div><div class="gap"></div><div class="panel">${ph('Port and route planning master','Route rows are references only; manual total planning TAT stays explicit.',canApprove(user)?button('Add route','route',{},'small','plus'):'')}<div class="table-wrap"><table><thead><tr><th>Route</th><th>Origin</th><th>Destination</th><th>Transit days</th><th></th></tr></thead><tbody>${state.routes.map(r=>`<tr><td>${esc(r.name)}<div class="sub">${esc(r.source)}</div></td><td>${esc(r.origin)}</td><td>${esc(r.destination)}</td><td>${r.transitDays}</td><td>${canApprove(user)?button('Edit','route',{route:r.id},'small'):''}</td></tr>`).join('')}</tbody></table></div></div>`;}

async function loadUserAccounts(){const actorId=user.id,request=(ui.accountRequest||0)+1;ui.accountRequest=request;ui.accountsError='';try{const r=await api('/users');if(user?.id!==actorId||ui.accountRequest!==request)return;ui.accounts=r.users;}catch(e){if(user?.id!==actorId||ui.accountRequest!==request)return;ui.accountsError=e.message;}if(ui.view==='settings'&&!ui.modal)render();}
function userAccessPanel(){const admin=user.role==='ADMIN'&&!sandbox;return `<div class="panel">${ph('User access portal',admin?'Create an account, then review its role and division access.':'Role controls the action; scope controls the records available.')}${sandbox?`<div class="panel-body">${note('This browser review uses sample profiles. Sign in to the hosted application as an administrator to create a real user account.','blue')}</div>`:''}${admin&&ui.accountsError?`<div class="panel-body">${note(esc(ui.accountsError),'warn')}${button('Refresh users','refresh-users',{},'small','history')}</div>`:''}<div class="table-wrap"><table><thead><tr><th>User / role</th>${admin?'<th>Email</th><th>Sign-in status</th>':''}${SCOPES.map(s=>`<th>${SCOPE_LABELS[s]}</th>`).join('')}</tr></thead><tbody>${state.users.map(u=>{const account=ui.accounts?.find(a=>a.id===u.id);return `<tr><td class="strong">${esc(u.name)}<div class="sub">${esc(userRoleLabel(u.role))}</div>${user.role==='ADMIN'&&u.id!==user.id?button('Change role','change-role',{user:u.id},'small ghost','edit'):''}</td>${admin?`<td>${esc(account?.email||(ui.accounts?'No sign-in account':'Loading…'))}</td><td>${account?badge(account.hasAccount?(account.active?'Active':'Inactive'):'Profile only',account.active?'green':'dark'):badge(ui.accounts?'Profile only':'Loading','dark')}</td>`:''}${SCOPES.map(s=>`<td><input type="checkbox" aria-label="${esc(u.name+' '+SCOPE_LABELS[s])}" data-user-scope="${u.id}" data-scope="${s}" ${u.role==='ADMIN'||u.scopes.includes(s)?'checked':''} ${user.role!=='ADMIN'||u.role==='ADMIN'?'disabled':''}></td>`).join('')}</tr>`;}).join('')}</tbody></table></div><div class="panel-footer">Administrators have access to all divisions. Only LAE Import currently has an operational workflow. Assignment changes are excluded from the business interaction log; new account creation and role changes are recorded. Role changes apply to existing sessions immediately. Your own administrator role cannot be changed here.</div></div>`;}
function userCreationModal(){return {title:'Create user',sub:'Set up an account for this purchase workspace.',submit:'Create user',wide:false,body:`<div class="form-grid">${field('name','Full name','','text',{required:true,attrs:'maxlength="120" autocomplete="name"'})}${field('email','Email address','','email',{required:true,attrs:'maxlength="254" autocomplete="off" autocapitalize="none"'})}${field('role','Role','EXECUTIVE','select',{required:true,full:true,options:USER_ROLES.map(role=>({value:role,label:userRoleLabel(role)}))})}<div class="full"><p class="small muted" id="new-user-role-hint">${esc(userRoleHelp('EXECUTIVE'))}</p></div>${field('password','Password','','password',{required:true,attrs:'minlength="12" maxlength="256" autocomplete="new-password"',hint:'Use 12–256 characters. Share the password with the user through your usual secure channel.'})}${field('confirmPassword','Confirm password','','password',{required:true,attrs:'minlength="12" maxlength="256" autocomplete="new-password"'})}</div><div class="form-section">Division access</div><div class="check-list">${SCOPES.map(scope=>checkbox('scopes',SCOPE_LABELS[scope],scope==='LAE_IMPORT',scope)).join('')}</div>${note('Select at least one division. Administrators have access to every division. LAE Domestic, Utility and Implements workflows are planned.','blue')}`};}
async function createUserFromForm(form,values){if(busy)return;if(sandbox||user.role!=='ADMIN')throw new Error('Administrator access is required to create users.');if(values.get('password')!==values.get('confirmPassword'))throw new Error('Passwords do not match.');const scopes=values.get('role')==='ADMIN'?[...SCOPES]:values.getAll('scopes');if(!scopes.length)throw new Error('Select at least one division.');busy=true;const submit=form.querySelector('[type=submit]');submit.disabled=true;try{const r=await api('/users',{method:'POST',body:JSON.stringify({name:values.get('name'),email:values.get('email'),password:values.get('password'),role:values.get('role'),scopes,expectedRevision:state.revision})});state=r.state;ui.accountRequest=(ui.accountRequest||0)+1;ui.accounts=r.users;ui.accountsError='';form.reset();closeModal();render();toast('User created. They can now sign in with their email and password.');}finally{busy=false;submit.disabled=false;}}
function field(name,label,value='',type='text',opt={}){const req=opt.required?' required':'';let input;if(type==='select')input=`<select name="${name}" ${opt.attrs||''}${req}>${(opt.options||[]).map(o=>{const v=typeof o==='object'?o.value:o,l=typeof o==='object'?o.label:o;return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`;}).join('')}</select>`;else if(type==='textarea')input=`<textarea name="${name}" ${opt.attrs||''}${req}>${esc(value)}</textarea>`;else input=`<input name="${name}" type="${type}" ${type==='file'?'':`value="${esc(value)}"`} ${opt.attrs||''}${req}>`;return `<div class="field ${opt.full?'full':''}"><label>${label}${opt.required?' <span style="color:#b57153">*</span>':''}${input}</label>${opt.hint?`<small>${esc(opt.hint)}</small>`:''}</div>`;}
const moneyField=(n,l,v,opt={})=>field(n,l,v,'number',{...opt,attrs:`min="0" step="0.01" ${opt.attrs||''}`});

const multiFileField=(label='Supporting documents')=>`<div class="field full"><label>${esc(label)}<input name="files" type="file" multiple accept="${UPLOAD_EXTENSIONS.map(x=>'.'+x).join(',')}"></label><small>Multiple files allowed; maximum 50 MB each. They remain linked to this submission.</small></div>`;
const checkbox=(name,label,checked=false,value='on')=>`<label class="checkbox"><input type="checkbox" name="${name}" value="${esc(value)}" ${checked?'checked':''}>${esc(label)}</label>`;
function vendorBases(vendorId){return state.bases.filter(b=>b.vendorId===vendorId&&b.lifecycleStatus!=='INACTIVE');}
function itemForBrand(baseId,prefix){return state.items.find(i=>i.baseId===baseId&&i.brandPrefix===prefix&&i.active!==false);}
function basePlanFromLines(lines=[]){const plans=[];for(const l of lines){let p=plans.find(x=>x.baseId===l.baseId);if(!p){p={baseId:l.baseId,unitPrice:major(l.unitPriceMinor),specId:l.specId||'',quantities:{GJ:0,KD:0,TT:0}};plans.push(p);}const i=state.items.find(i=>i.id===l.itemId);const prefix=i?.brandPrefix||String(l.code||'').split('-')[0];if(['GJ','KD','TT'].includes(prefix))p.quantities[prefix]=(p.quantities[prefix]||0)+Number(l.quantity||0);}return plans;}
function expandedDraftLines(p){const lines=[];for(const bp of p.basePlans||[]){for(const prefix of ['GJ','KD','TT']){const qty=Number(bp.quantities?.[prefix]||0);if(qty<=0)continue;const item=itemForBrand(bp.baseId,prefix);if(!item)continue;lines.push({itemId:item.id,quantity:qty,unitPrice:bp.unitPrice||'0.00',specId:bp.specId||'',artworkNotes:item.artworkNotes||''});}}return lines;}
function basePriceHint(p,bp,idx=''){const b=state.bases.find(x=>x.id===bp.baseId),attr=idx===''?'':` data-price-hint="${idx}"`;if(!b)return `<span${attr} class="sub">Select a Base Item Code to retrieve the current supplier price.</span>`;const ref=currentApprovedPrice(state,p.vendorId,b.id,p.priceListCurrency||p.currency);if(!ref)return `<span${attr} class="sub">No current ${esc(p.priceListCurrency||p.currency)} price list for Base Item ${esc(b.code)}. Enter price manually or add it in Supplier price lists.</span>`;const entered=Number(bp.unitPrice||0),listed=Number(major(ref.unitPriceMinor));const same=Math.abs(entered-listed)<0.00001;return `<span${attr} class="sub ${same?'':'price-warning'}">${same?'Current base-product price matched':'Warning: entered price differs from current base-product price list'} · ${esc(ref.currency)} ${major(ref.unitPriceMinor)} · effective ${dt(ref.effectiveDate)} · Rev ${ref.revision||1}</span>`;}
function productionReferenceForDraft(p){const refs=(p.basePlans||[]).map(x=>state.bases.find(b=>b.id===x.baseId)?.productionDays).filter(n=>Number.isFinite(Number(n))&&Number(n)>0).map(Number);const v=state.vendors.find(v=>v.id===p.vendorId);return refs.length?Math.max(...refs):Number(v?.productionDays||0);}

 else if(d.priceVendor==='select'){ui.data.vendor=el.value;renderModal();}
 else if(el.id==='revision-select'){ui.revision=Number(el.value);render();}
 else if(d.draft){ui.draft[d.draft]=el.value;if(d.draft==='vendorId'){const v=state.vendors.find(v=>v.id===el.value);ui.draft.productionDays=v.productionDays;ui.draft.productionOverrideReason='';ui.draft.currency=v.defaultBillingCurrency||v.currency;ui.draft.priceListCurrency=v.defaultPriceListCurrency||v.currency;ui.draft.paymentMethod=v.defaultPaymentMethod||'TT';ui.draft.routeId=state.routes.find(r=>r.origin===(v.defaultExportPort||'').toUpperCase()&&!r.via)?.id||state.routes.find(r=>r.origin===(v.defaultExportPort||'').toUpperCase())?.id||state.routes[0]?.id||'';ui.draft.paymentTerms=structuredClone(TERMS.find(t=>t.id===v.defaultTerms)||TERMS[0]);ui.draft.basePlans=[{baseId:'',unitPrice:'0.00',specId:'',quantities:{GJ:0,KD:0,TT:0}}];renderModal();}else if(d.draft==='priceListCurrency'){for(const bp of ui.draft.basePlans||[]){const ref=currentApprovedPrice(state,ui.draft.vendorId,bp.baseId,el.value);if(ref)bp.unitPrice=major(ref.unitPriceMinor);}renderModal();}else if(d.draft==='currency'){renderModal();}}
 else if(d.plan!==undefined){const bp=ui.draft.basePlans[Number(d.plan)];if(d.brand){bp.quantities=bp.quantities||{GJ:0,KD:0,TT:0};bp.quantities[d.brand]=Number(el.value||0);}else{bp[d.key]=el.value;if(d.key==='baseId'){const b=state.bases.find(x=>x.id===el.value);const ref=currentApprovedPrice(state,ui.draft.vendorId,el.value,ui.draft.priceListCurrency||ui.draft.currency);bp.specId=b?.specifications?.filter(x=>x.status==='APPROVED').at(-1)?.id||'';if(ref)bp.unitPrice=major(ref.unitPriceMinor);const refDays=productionReferenceForDraft(ui.draft);if(refDays){ui.draft.productionDays=refDays;if(!productionOverrideNeeded(ui.draft))ui.draft.productionOverrideReason='';}renderModal();}}}
 else if(d.template==='terms'){ui.draft.paymentTerms=structuredClone(TERMS.find(t=>t.id===el.value));renderModal();}
 else if(d.pay){ui.payment[d.pay]=el.value;if(d.pay==='currency')renderModal();}
 else if(d.payline!==undefined){const a=ui.payment.allocations[Number(d.payline)];a[d.key]=el.value;if(d.key==='orderId'){a.termKey='';renderModal();}}
 else if(d.userScope){const u=state.users.find(u=>u.id===d.userScope),scopes=el.checked?[...u.scopes,d.scope]:u.scopes.filter(s=>s!==d.scope);await command('SAVE_SCOPES',{userId:u.id,scopes},{message:'Division / purchase-type access updated.'});}
 else if(el.id==='item-import-file'){const file=el.files[0];ui.importRows=await readWorkbook(file);ui.importFile=file;renderModal();}
 else if(el.id==='tracking-import-file'){const file=el.files[0];ui.trackingRows=await readSheetWorkbook(file,['REF','STATUS'],1000);ui.trackingFile=file;renderModal();}
 else if(el.id==='rate-import-file'){const file=el.files[0];ui.rateRows=await readSheetWorkbook(file,['PORT OF LOADING','O/F USD'],500);ui.rateFile=file;renderModal();}
 }catch(e){showError(e.message);}}
function onInput(event){const el=event.target,d=el.dataset;if(el.id==='view-search'){const p=el.selectionStart;ui.search=el.value;ui.page=1;ui.selectedOrders=[];render();const e=$('#view-search');e?.focus();e?.setSelectionRange(p,p);}else if(d.draft){ui.draft[d.draft]=el.value;if(d.draft==='productionDays'){if(!productionOverrideNeeded(ui.draft))ui.draft.productionOverrideReason='';renderModal();}}else if(d.plan!==undefined){const idx=Number(d.plan),bp=ui.draft.basePlans[idx];if(d.brand){bp.quantities=bp.quantities||{GJ:0,KD:0,TT:0};bp.quantities[d.brand]=Number(el.value||0);}else{bp[d.key]=el.value;if(d.key==='unitPrice'){const h=document.querySelector(`[data-price-hint="${idx}"]`),tmp=document.createElement('div');if(h){tmp.innerHTML=basePriceHint(ui.draft,bp,idx);h.replaceWith(tmp.firstElementChild);}}}}else if(d.term!==undefined)ui.draft.paymentTerms.steps[Number(d.term)][d.key]=el.value;else if(d.pay)ui.payment[d.pay]=el.value;else if(d.payline!==undefined)ui.payment.allocations[Number(d.payline)][d.key]=el.value;}
function loginView(error=''){$('#app').innerHTML=`<div class="login-page"><section class="login-brand"><div class="brand login-logo-block" style="padding:0 0 45px"><div class="login-logo-shell"><img class="login-brand-logo" src="${FARMING_HUB_LOGO}" alt="Farming Hub"></div></div><div class="eyebrow" style="color:#94b59b">Purchase management</div><h1>From supplier commitment<br>to port arrival.</h1><p>One place for orders, approved specifications, follow-ups and payment history. LAE Import comes first.</p></section><section class="login-form"><form class="login-card" id="login-form"><h2>Welcome to your workspace</h2><p>Sign in with a local pilot account. Existing live VMS accounts are not connected to this build.</p>${error?`<div class="form-error visible">${esc(error)}</div>`:''}${field('email','Email','','email',{required:true})}${field('password','Password','','password',{required:true,attrs:'autocomplete="current-password"'})}<button class="button primary" type="submit">Sign in ${icon('arrow',15)}</button><p style="font-size:10px;margin-top:24px">Setup instructions are in the source package. No shared production password is provided.</p></form></section></div>`;}
document.addEventListener('click',onClick);document.addEventListener('submit',onSubmit);document.addEventListener('change',onChange);document.addEventListener('input',onInput);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal&&!submitting)closeModal();if(e.key==='Enter'&&e.target.id==='global-search'){const q=e.target.value.toLowerCase(),o=visibleOrders().find(o=>[o.number,...o.lines.map(l=>l.code)].join(' ').toLowerCase().includes(q));if(o){ui.tab='overview';navigate('order/'+o.id);}else{ui.view='items';ui.masterTab='items';ui.search=e.target.value;render();}}if(e.key==='Tab'&&ui.modal){const ns=[...$('#modal-root').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')];if(e.shiftKey&&document.activeElement===ns[0]){e.preventDefault();ns.at(-1)?.focus();}else if(!e.shiftKey&&document.activeElement===ns.at(-1)){e.preventDefault();ns[0]?.focus();}}if(['Enter',' '].includes(e.key)&&e.target.matches('.board-card')){e.preventDefault();ui.tab='overview';navigate('order/'+e.target.dataset.id);}});
window.addEventListener('hashchange',route);window.addEventListener('storage',e=>{if(sandbox&&e.key===STORE){try{const s=JSON.parse(e.newValue);if(s?.schemaVersion===SCHEMA_VERSION){state=s;user=state.users.find(u=>u.id===user.id);render();toast('Review workspace refreshed from another tab.');}}catch{}}});
start().catch(e=>{$('#app').innerHTML=empty('Workspace could not start',e.message);});
</script></body></html>
