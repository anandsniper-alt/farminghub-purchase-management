name: Native tests and review build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref != 'refs/heads/lae-analytics-live' && github.base_ref != 'lae-analytics-live'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Existing document export dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-openpyxl python3-reportlab python3-pypdf weasyprint fonts-liberation fonts-noto-cjk
      - run: node --test tests/*.test.mjs
        env:
          FH_PYTHON: /usr/bin/python3
          FH_PO_PDF_QA_OUTPUT: ${{ runner.temp }}/po-pdf-qa
      - run: node scripts/build.mjs --domestic-preview
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test analytics/tests/*.test.mjs
