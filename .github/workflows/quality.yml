name: Native tests and review build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Existing document export dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-openpyxl python3-reportlab
      - run: node --test tests/*.test.mjs
        env:
          FH_PYTHON: /usr/bin/python3
      - run: node scripts/build.mjs --domestic-preview
